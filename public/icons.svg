<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Iconos dibujados a mano (sin librería). Se usan con
    <svg class="icon"><use href="/icons.svg#nombre" /></svg>.
    Trazo redondeado de 1.75 y un relleno suave del mismo color para darles
    calidez: es una taquería, no un banco. Heredan el color con currentColor.
  -->

  <!-- Interfaz -->
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="menu" viewBox="0 0 24 24">
    <path d="M4 7h16M4 12h16M4 17h16" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6 6 18" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="check" viewBox="0 0 24 24">
    <path d="m5 12.5 4.5 4.5L19 7" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="minus" viewBox="0 0 24 24">
    <path d="M6 12h12" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="plus" viewBox="0 0 24 24">
    <path d="M12 6v12M6 12h12" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="pause" viewBox="0 0 24 24">
    <rect fill="currentColor" fill-opacity="0.16" x="6.5" y="5" width="3.5" height="14" rx="1.2" />
    <rect fill="currentColor" fill-opacity="0.16" x="14" y="5" width="3.5" height="14" rx="1.2" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="play" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
  </symbol>

  <!-- Formulario -->
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="user" viewBox="0 0 24 24">
    <circle fill="currentColor" fill-opacity="0.16" cx="12" cy="8" r="4" />
    <path d="M4.5 20c.6-3.6 3.7-5.8 7.5-5.8s6.9 2.2 7.5 5.8" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="calendar" viewBox="0 0 24 24">
    <rect fill="currentColor" fill-opacity="0.16" x="3.5" y="5" width="17" height="15.5" rx="3" />
    <path d="M3.5 10h17M8 3v4M16 3v4" />
    <circle cx="8.5" cy="14.5" r="1.1" fill="currentColor" stroke="none" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="card" viewBox="0 0 24 24">
    <rect fill="currentColor" fill-opacity="0.16" x="2.5" y="5" width="19" height="14" rx="3" />
    <path d="M2.5 10h19M6.5 15h4" />
  </symbol>

  <!-- Catering -->
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="utensils" viewBox="0 0 24 24">
    <path d="M6 3v5.5a2 2 0 0 0 4 0V3M8 3v18" />
    <path fill="currentColor" fill-opacity="0.16" d="M17.5 21V3c-2 .9-3.5 3.6-3.5 7.2V13h3.5" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="cloche" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M4.5 17a7.5 7.5 0 0 1 15 0z" />
    <path d="M2.5 17h19M12 9.5V7.5M10.2 7.5h3.6M7.5 20h9" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="truck" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M2.5 6.5h11v9.5h-11z" />
    <path d="M13.5 9.5h4l3 3.5v3h-7" />
    <circle cx="7" cy="17.5" r="1.9" />
    <circle cx="17" cy="17.5" r="1.9" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="pin" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M12 21s-7-6.1-7-11.3a7 7 0 0 1 14 0C19 14.9 12 21 12 21z" />
    <circle cx="12" cy="9.7" r="2.5" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="taco" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M2.5 17.5a9.5 9.5 0 0 1 19 0z" />
    <path d="M5.6 12.4c.9-.8 1.9-.8 2.8 0s1.9.8 2.8 0 1.9-.8 2.8 0 1.9.8 2.8 0 1.4-.6 2 0" />
    <circle cx="9" cy="15" r=".9" fill="currentColor" stroke="none" />
    <circle cx="13.5" cy="15.3" r=".9" fill="currentColor" stroke="none" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="glass" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M7.5 3h9l-.6 5.6a3.9 3.9 0 0 1-7.8 0z" />
    <path d="M7.9 6.5h8.2M12 12.5V20M8.5 20.5h7" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="party" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M4 20.5 8.2 8.8l7 7z" />
    <path d="M14 3.5v2.2M20.5 10h-2.2M17.8 5.2l-1.6 1.6M12.2 8.8c.6-1.6.2-3-.8-3.8M15.2 11.8c1.6-.6 3-.2 3.8.8" />
    <circle cx="19.5" cy="3.8" r=".9" fill="currentColor" stroke="none" />
    <circle cx="20.2" cy="14.5" r=".9" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Menú -->
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="leaf" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M5 19C5 10.5 10 5 19 5c0 9-5.5 14-14 14z" />
    <path d="M5 19l8.5-8.5" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="chile" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M6.8 19.8c-2.6-.4-2.4-3.2.2-4 4-1.3 6.6-4.3 7.7-8.6l3.2 1.1c-.9 6.6-5.3 12.2-11.1 11.5z" />
    <path d="M16.2 7.6c.1-1.9 1.2-3.3 3-3.8M15.2 7.2l3.6 1.3" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="corn" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M9 16.5C6.8 12.2 9.5 5 15 3.5c2.2 5.4-.8 12-6 13z" />
    <path d="M10.6 8.6l3.6 1.6M9.7 11.8l3.4 1.4M12.3 5.8l2.8 1.3" />
    <path d="M9 16.5c-2.3.6-3.8 2.5-4 4.5 3 .2 5.5-1.2 6.5-3.6M9 16.5c.3-2.3-.4-4.4-2-5.8" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="cup" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M6.5 8h11l-1.3 11.3a2 2 0 0 1-2 1.7H9.8a2 2 0 0 1-2-1.7z" />
    <path d="M7 12h10M12.5 8l2-5h3" />
  </symbol>
  <symbol fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="flan" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity="0.16" d="M6.5 17.5 8 10h8l1.5 7.5z" />
    <path d="M8 10c1-1.6 2.5-2.4 4-2.4s3 .8 4 2.4M3.5 19.5h17" />
  </symbol>
</svg>
