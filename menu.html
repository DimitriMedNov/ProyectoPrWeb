<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Menú de El Taquito Gordo Feliz: especialidades de la casa, tacos, bebidas y opciones vegetarianas y veganas." />
    <title>Menú — El Taquito Gordo Feliz</title>

    <meta property="og:title" content="Menú — El Taquito Gordo Feliz" />
    <meta property="og:description" content="Especialidades de la casa, tacos, bebidas y opciones vegetarianas y veganas." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fffdfa" />
    <!-- Tema antes del primer pintado (sin destello): pone la clase `dark` en
         <html> según la preferencia guardada (clave "tema": "light" | "dark") o,
         si no hay, según el sistema. Misma clave que src/hooks/use-tema.ts. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("tema"); } catch (e) {}
        var d = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        r.classList.toggle("dark", d);
        r.style.colorScheme = d ? "dark" : "light";
        if (d) {
          document.querySelector('meta[name="color-scheme"]').content = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#110f0d";
        }
      })();
    </script>
    <!-- CSS crítico en línea: fondo del tema y tamaños básicos antes de que
         cargue la hoja de estilos (en desarrollo, Vite la inyecta con JS). -->
    <style>
      html { background: #fffdfa; color: #1a1a1a; }
      html.dark { background: #110f0d; color: #f5f0e8; }
      img { max-width: 100%; height: auto; }
    </style>
    <!-- Hoja de estilos enlazada: bloquea el primer pintado hasta que carga,
         así la página nunca se ve sin estilos (ni en desarrollo ni publicada). -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="icon" href="/img/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="bg-void text-txt">
    <div id="root"></div>
    <noscript>Este sitio necesita JavaScript para mostrarse. Actívalo en tu navegador y vuelve a cargar la página.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
